name: it-shaharcha

# Runs the full backend stack from prebuilt jars.
# Prerequisite: build the jars first from the repo root:  mvn clean install -DskipTests
# Then:  docker compose -f infra/docker/docker-compose.full.yml up -d
#
# Jars are mounted (not baked) so rebuilds are instant: re-run mvn, then
#   docker compose -f infra/docker/docker-compose.full.yml restart auth-service user-service api-gateway

x-jwt-secret: &jwt-secret "change-me-to-a-very-long-and-secure-development-secret-key"

services:
  postgres:
    image: postgres:16-alpine
    container_name: itsh-postgres
    environment:
      POSTGRES_USER: itsh
      POSTGRES_PASSWORD: itsh_secret
      POSTGRES_DB: itsh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itsh"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: itsh-redis
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  eureka-server:
    image: eclipse-temurin:25-jre-alpine
    container_name: itsh-eureka
    working_dir: /app
    environment:
      EUREKA_HOSTNAME: eureka-server
    volumes:
      - ../../services/eureka-server/target/eureka-server.jar:/app/app.jar:ro
    command: ["java", "-jar", "/app/app.jar"]
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth-service:
    image: eclipse-temurin:25-jre-alpine
    container_name: itsh-auth
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/auth_db
      DB_USERNAME: itsh
      DB_PASSWORD: itsh_secret
      JWT_SECRET: *jwt-secret
      AUTH_AUTO_ACTIVATE: "true"   # DEV: skip OTP so the UI flow is smooth
    volumes:
      - ../../services/auth-service/target/auth-service.jar:/app/app.jar:ro
    command: ["java", "-jar", "/app/app.jar"]
    ports:
      - "9001:9001"

  identity-service:
    image: eclipse-temurin:25-jre-alpine
    container_name: itsh-identity
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/identity_db
      DB_USERNAME: itsh
      DB_PASSWORD: itsh_secret
      JWT_SECRET: *jwt-secret
      AUTH_AUTO_ACTIVATE: "true"   # DEV: skip OTP so the UI flow is smooth
      EUREKA_URL: http://eureka-server:8761/eureka/
    volumes:
      - ../../services/identity-service/target/identity-service.jar:/app/app.jar:ro
    command: ["java", "-jar", "/app/app.jar"]
    ports:
      - "9003:9003"

  learning-service:
    image: eclipse-temurin:25-jre-alpine
    container_name: itsh-learning
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/learning_db
      DB_USERNAME: itsh
      DB_PASSWORD: itsh_secret
      JWT_SECRET: *jwt-secret
      EUREKA_URL: http://eureka-server:8761/eureka/
    volumes:
      - ../../services/learning-service/target/learning-service.jar:/app/app.jar:ro
    command: ["java", "-jar", "/app/app.jar"]
    ports:
      - "9004:9004"

  user-service:
    image: eclipse-temurin:25-jre-alpine
    container_name: itsh-user
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/users_db
      DB_USERNAME: itsh
      DB_PASSWORD: itsh_secret
    volumes:
      - ../../services/user-service/target/user-service.jar:/app/app.jar:ro
    command: ["java", "-jar", "/app/app.jar"]
    ports:
      - "9002:9002"

  api-gateway:
    image: eclipse-temurin:25-jre-alpine
    container_name: itsh-gateway
    working_dir: /app
    depends_on:
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      identity-service:
        condition: service_started
      learning-service:
        condition: service_started
      user-service:
        condition: service_started
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # identity-service and learning-service are resolved via Eureka (lb:// routes).
      USER_SERVICE_URI: http://user-service:9002
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: *jwt-secret
    volumes:
      - ../../services/api-gateway/target/api-gateway.jar:/app/app.jar:ro
    command: ["java", "-jar", "/app/app.jar"]
    ports:
      - "8080:8080"

volumes:
  pgdata:
