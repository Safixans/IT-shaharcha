server:
  port: 9007

spring:
  application:
    name: analytics-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/analytics_db}
    username: ${DB_USERNAME:itsh}
    password: ${DB_PASSWORD:itsh_secret}
    hikari:
      pool-name: analytics-pool
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP:analytics-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        # Producers don't ship type headers, so pin the value type and trust the envelope package.
        spring.json.value.default.type: com.itshaharcha.analytics.event.DomainEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: "com.itshaharcha.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

app:
  events:
    # Set true (and run a broker) to consume itsh.<service>.events and publish analytics.* events.
    # When false, events arrive only via the REST ingest fallback.
    kafka-enabled: ${KAFKA_ENABLED:false}
  security:
    jwt:
      # Analytics validates (does not mint) tokens; secret + issuer MUST match the
      # values identity-service signs with. >= 32 bytes for HS256.
      secret: ${JWT_SECRET:change-me-to-a-very-long-and-secure-development-secret-key}
      issuer: it-shaharcha-auth

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.itshaharcha.analytics: INFO
    # Logbook emits HTTP request/response logs at TRACE.
    org.zalando.logbook: ${LOGBOOK_LEVEL:TRACE}
