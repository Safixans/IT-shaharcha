server:
  port: 9008

spring:
  application:
    name: attachment-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/attachment_db}
    username: ${DB_USERNAME:itsh}
    password: ${DB_PASSWORD:itsh_secret}
    hikari:
      pool-name: attachment-pool
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      # Audio/PDF/image uploads — keep generous but bounded.
      max-file-size: ${MAX_FILE_SIZE:50MB}
      max-request-size: ${MAX_REQUEST_SIZE:50MB}

app:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-to-a-very-long-and-secure-development-secret-key}
      issuer: it-shaharcha-auth
  minio:
    # Internal endpoint the service uses for put/stat/bucket ops.
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    # Browser-reachable endpoint used to SIGN download URLs (must resolve for the client).
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:itsh-attachments}
    presign-expiry-seconds: ${MINIO_PRESIGN_TTL:600}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.itshaharcha.attachment: INFO
    org.zalando.logbook: ${LOGBOOK_LEVEL:TRACE}
