server:
  port: 9001

spring:
  application:
    name: auth-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${DB_USERNAME:itsh}
    password: ${DB_PASSWORD:itsh_secret}
    hikari:
      pool-name: auth-pool
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid,profile,email

app:
  auth:
    # DEV ONLY: when true, new accounts skip OTP and are created ACTIVE/verified.
    # Keep false in production to enforce email verification.
    auto-activate: ${AUTH_AUTO_ACTIVATE:false}
  events:
    # Set true (and run a broker) to publish domain events to Kafka.
    kafka-enabled: ${KAFKA_ENABLED:false}
  cleanup:
    refresh-tokens-cron: "0 0 3 * * *"
  security:
    jwt:
      # CHANGE in production; must be >= 32 bytes for HS256.
      secret: ${JWT_SECRET:change-me-to-a-very-long-and-secure-development-secret-key}
      issuer: it-shaharcha-auth
      access-token-ttl: 15m
      refresh-token-ttl: 7d

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.itshaharcha.auth: INFO
