# Shared OpenAPI components for the IT-Shaharcha platform.
# Every service spec $refs into this file so the wire contract (envelope, errors,
# pagination, security, common params) is identical across all services.
#
#   $ref: "./shared/common.yaml#/components/schemas/ApiResponse"
#
# OpenAPI 3.1 has no generics. The convention for a typed success body is:
#
#   allOf:
#     - $ref: "./shared/common.yaml#/components/schemas/ApiResponse"
#     - type: object
#       properties:
#         data: { $ref: "#/components/schemas/MyType" }
openapi: 3.1.0
info:
  title: IT-Shaharcha — Shared Components
  version: 1.0.0
  description: >
    Cross-cutting schemas, parameters, responses and security schemes shared by
    every IT-Shaharcha service. Not a deployable API on its own.
  license:
    name: Apache-2.0
    identifier: Apache-2.0

# No paths — this file only contributes reusable components.
paths: {}

components:
  # --------------------------------------------------------------------------
  # Security
  # --------------------------------------------------------------------------
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Access token issued by the identity service. Sent as
        `Authorization: Bearer <jwt>`. The API gateway validates it and forwards
        identity to downstream services via trusted headers (X-Account-Id,
        X-Username, X-Roles); clients never send those headers directly.

  # --------------------------------------------------------------------------
  # Reusable query/path parameters
  # --------------------------------------------------------------------------
  parameters:
    PageParam:
      name: page
      in: query
      required: false
      description: Zero-based page index.
      schema: { type: integer, minimum: 0, default: 0 }
    SizeParam:
      name: size
      in: query
      required: false
      description: Page size (max 100).
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    SortParam:
      name: sort
      in: query
      required: false
      description: >
        Sort expression as `field,(asc|desc)`. Repeatable for multi-key sort.
      schema:
        type: array
        items: { type: string }
      example: ["createdAt,desc"]
    FromParam:
      name: from
      in: query
      required: false
      description: Inclusive lower bound (ISO-8601 instant) for time-ranged queries.
      schema: { type: string, format: date-time }
    ToParam:
      name: to
      in: query
      required: false
      description: Exclusive upper bound (ISO-8601 instant) for time-ranged queries.
      schema: { type: string, format: date-time }
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        Optional client-generated key (UUID recommended) to make unsafe POSTs
        retry-safe. The server returns the original result for a repeated key.
      schema: { type: string, maxLength: 64 }

  # --------------------------------------------------------------------------
  # Schemas
  # --------------------------------------------------------------------------
  schemas:
    ApiResponse:
      type: object
      description: >
        Uniform success envelope. `data` is overridden per endpoint via allOf —
        do NOT add a schema-level example here, or it masks the real `data` shape
        of every endpoint in Swagger UI.
      required: [success, timestamp]
      properties:
        success:
          type: boolean
          const: true
          example: true
        message:
          type: [string, "null"]
          description: Optional human-readable note.
          example: "OK"
        data:
          description: Endpoint-specific payload (overridden via allOf).
        timestamp:
          type: string
          format: date-time
          example: "2026-05-29T10:15:00Z"

    ErrorResponse:
      type: object
      description: Uniform error envelope returned for any non-2xx response.
      required: [success, error, timestamp]
      properties:
        success:
          type: boolean
          const: false
          example: false
        error:
          $ref: "#/components/schemas/ErrorDetail"
        timestamp:
          type: string
          format: date-time
          example: "2026-05-29T10:15:00Z"
        path:
          type: [string, "null"]
          description: Request path that produced the error.
          example: "/api/v1/identity/roles"
        traceId:
          type: [string, "null"]
          description: Correlation id for log lookup.
          example: "b7f1c2a4e5d6"
      example:
        success: false
        error:
          code: "UNAUTHORIZED"
          message: "Missing or invalid authentication."
        timestamp: "2026-05-29T10:15:00Z"
        path: "/api/v1/identity/roles"
        traceId: "b7f1c2a4e5d6"

    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          example: "Request failed validation."
        fieldErrors:
          type: array
          description: Per-field validation failures (present for VALIDATION_FAILED).
          items: { $ref: "#/components/schemas/FieldError" }

    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string, example: "email" }
        message: { type: string, example: "must be a valid email address" }
        rejectedValue: { example: "not-an-email" }

    ErrorCode:
      type: string
      description: Stable machine-readable error code. Clients branch on this, not on text.
      enum:
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - INVALID_CREDENTIALS
        - TOKEN_INVALID
        - TOKEN_EXPIRED
        - RATE_LIMITED
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - DEPENDENCY_UNAVAILABLE
        - INTERNAL_ERROR

    PageMeta:
      type: object
      required: [page, size, totalElements, totalPages, hasNext]
      properties:
        page: { type: integer, minimum: 0, example: 0 }
        size: { type: integer, minimum: 1, example: 20 }
        totalElements: { type: integer, minimum: 0, example: 137 }
        totalPages: { type: integer, minimum: 0, example: 7 }
        hasNext: { type: boolean, example: true }

    Page:
      type: object
      description: >
        Generic pagination envelope. `items` is overridden per endpoint via allOf,
        the same way `ApiResponse.data` is.
      required: [items, meta]
      properties:
        items:
          type: array
          items: {}
        meta:
          $ref: "#/components/schemas/PageMeta"

    # Convenience reference for IDs used everywhere.
    UUID:
      type: string
      format: uuid

    Money:
      type: object
      description: Minor-unit money to avoid float rounding.
      required: [amount, currency]
      properties:
        amount: { type: integer, description: Amount in the currency's minor unit (e.g. tiyin/cents)., example: 4990000 }
        currency: { type: string, minLength: 3, maxLength: 3, example: "UZS" }

  # --------------------------------------------------------------------------
  # Reusable responses (always the ErrorResponse envelope)
  # --------------------------------------------------------------------------
  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ValidationFailed:
      description: Request failed validation (see error.fieldErrors).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: Authenticated but not permitted.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Resource does not exist.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: State conflict (e.g. duplicate, version mismatch).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    PayloadTooLarge:
      description: Uploaded body exceeds the allowed size.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds to wait before retrying.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
